services:
  # 1. PostgreSQL 16 Relational Database
  db:
    image: postgres:16-alpine
    container_name: xian-games-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required in .env}
      POSTGRES_DB: ${POSTGRES_DB:-xian_games}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-xian_games}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # 2. Next.js 16 + Socket.io Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xian-games-app-prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-xian_games}
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-sharedxian@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-}
      ADMIN_NAME: ${ADMIN_NAME:-Super Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ./data:/app/data
    networks:
      - app-network

  # 3. Caddy Reverse Proxy with Automated Let's Encrypt SSL
  caddy:
    image: caddy:2-alpine
    container_name: xian-games-caddy-prod
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      SSL_EMAIL: ${SSL_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network

volumes:
  pgdata_prod:
    name: xian_games_pgdata_prod
  caddy_data:
    name: xian_games_caddy_data
  caddy_config:
    name: xian_games_caddy_config

networks:
  app-network:
    name: xian_games_network
    driver: bridge
