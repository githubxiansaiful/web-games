# Alternative Nginx configuration with full WebSocket support
# For users preferring Nginx + Certbot on Hostinger VPS

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Upstream application container
    upstream nextjs_app {
        server app:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # WebSocket & HTTP Reverse Proxy
        location / {
            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;

            # Critical for Socket.io WebSocket connections
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Cache static Next.js assets
        location /_next/static/ {
            proxy_pass http://nextjs_app;
            proxy_cache_bypass 1;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
