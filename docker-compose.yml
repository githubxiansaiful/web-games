services:
  # PostgreSQL 16 Database
  db:
    image: postgres:16-alpine
    container_name: xian-games-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xian_secure_pg_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-xian_games}
    ports:
      - "5437:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-xian_games}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Next.js 16 + Socket.io Multiplayer Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xian-games-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-xian_secure_pg_pass_2026}@db:5432/${POSTGRES_DB:-xian_games}
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-sharedxian@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-}
      ADMIN_NAME: ${ADMIN_NAME:-Super Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
    name: xian_games_pgdata
